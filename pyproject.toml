[project]
dependencies = [
  "ipykernel>=7.3.0",
  "ipython-sql>=0.5.0",
  "jupyter-ruff>=0.3.1",
  "jupyter>=1.1.1",
  "jupyterlab-sql>=0.3.3",
  "jupyterlab>=4.6.3",
  "matplotlib>=3.11.1",
  "numpy>=2.5.2",
  "pandas[excel,parquet,performance,plot]>=3.0.5",
  "pydantic>=2.13.4",
  "pyodbc>=5.3.0",
  "python-dotenv>=1.2.3",
  "ruff>=0.16.3",
  "seaborn>=0.13.2",
  "sqlalchemy>=2.0.52",
]
name = "data-analyst-learning"
requires-python = ">=3.14"
version = "0.0.0"

[project.scripts]
warehouse = "warehouse.src.main:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["warehouse"]
